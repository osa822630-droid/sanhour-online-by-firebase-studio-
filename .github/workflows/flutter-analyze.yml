name: flutter-analyze

on:
  push:
    branches:
      - main
      - gemini-branch
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versions
        run: |
          flutter --version
          dart --version

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        id: analyze
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          code=$?
          echo "exit code: $code" >> analyze.txt
          cat analyze.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: flutter test
        id: unit_test
        run: |
          flutter test --no-pub

      - name: Publish analyze report
        if: always()
        uses: actions/github-script@v7
        env:
          ANALYZE_CODE: ${{ steps.analyze.outputs.code }}
        with:
          script: |
            const fs = require('fs');
            let text = fs.existsSync('analyze.txt') ? fs.readFileSync('analyze.txt', 'utf8') : '(no analyze.txt)';
            if (text.length > 60000) text = text.slice(0, 60000) + '\n... (truncated)';
            const code = process.env.ANALYZE_CODE || 'n/a';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'flutter-analyze-report',
              head_sha: context.sha,
              status: 'completed',
              conclusion: code === '0' ? 'success' : 'failure',
              output: {
                title: 'flutter analyze (exit ' + code + ')',
                summary: 'exit code ' + code,
                text: '```\n' + text + '\n```',
              },
            });

      - name: Fail if analyzer found errors
        if: steps.analyze.outputs.code != '0'
        run: exit 1
