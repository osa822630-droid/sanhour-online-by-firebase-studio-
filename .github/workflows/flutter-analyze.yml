name: flutter-analyze

on:
  push:
    branches:
      - main
      - gemini-branch
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
          cache: true

      - name: Versions
        run: |
          flutter --version
          dart --version

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        id: analyze
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos > analyze.txt 2>&1
          code=$?
          echo "exit code: $code" >> analyze.txt
          cat analyze.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: flutter test
        id: unit_test
        run: |
          set +e
          flutter test --no-pub > test.txt 2>&1
          tcode=$?
          echo "exit code: $tcode" >> test.txt
          cat test.txt
          echo "code=$tcode" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish analyze & test report
        if: always()
        uses: actions/github-script@v7
        env:
          ANALYZE_CODE: ${{ steps.analyze.outputs.code }}
          TEST_CODE: ${{ steps.unit_test.outputs.code }}
        with:
          script: |
            const fs = require('fs');
            const aText = fs.existsSync('analyze.txt') ? fs.readFileSync('analyze.txt', 'utf8') : '(no analyze.txt)';
            const tText = fs.existsSync('test.txt') ? fs.readFileSync('test.txt', 'utf8') : '(no test.txt)';
            let combined = '=== FLUTTER ANALYZE ===\n' + aText + '\n\n=== FLUTTER TEST ===\n' + tText;
            if (combined.length > 60000) combined = combined.slice(0, 60000) + '\n... (truncated)';
            const aCode = process.env.ANALYZE_CODE || 'n/a';
            const tCode = process.env.TEST_CODE || 'n/a';
            const ok = (aCode === '0' && tCode === '0');
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'flutter-analyze-report',
              head_sha: context.sha,
              status: 'completed',
              conclusion: ok ? 'success' : 'failure',
              output: {
                title: `analyze (exit ${aCode}) & test (exit ${tCode})`,
                summary: `analyze=${aCode}, test=${tCode}`,
                text: '```\n' + combined + '\n```',
              },
            });

      - name: Fail if analyzer or unit tests found errors
        if: steps.analyze.outputs.code != '0' || steps.unit_test.outputs.code != '0'
        run: exit 1
