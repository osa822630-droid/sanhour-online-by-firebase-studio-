name: Build Release APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build Mode (release or debug)'
        required: false
        default: 'release'
      split_per_abi:
        description: 'Build split APKs per ABI'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: read
  checks: write

env:
  DEFAULT_BUILD_MODE: 'release'
  DEFAULT_SPLIT_ABI: 'false'

jobs:
  build-apk:
    name: Build Sanhour Online Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Verify Flutter & Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies (flutter pub get)
        run: flutter pub get

      - name: Run Unit & Widget Tests
        run: flutter test --no-pub

      - name: Generate Production Keystore (if key.properties is missing)
        run: |
          if [ ! -f "android/key.properties" ]; then
            echo "Generating release keystore for APK signing..."
            keytool -genkey -v -keystore android/app/sanhour-release-key.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias sanhour_key \
              -storepass sanhourOnline2026 \
              -keypass sanhourOnline2026 \
              -dname "CN=Sanhour Online, OU=Mobile, O=Sanhour, L=Fayoum, ST=Fayoum, C=EG"
            printf "storePassword=sanhourOnline2026\nkeyPassword=sanhourOnline2026\nkeyAlias=sanhour_key\nstoreFile=sanhour-release-key.jks\n" > android/key.properties
          fi

      - name: Build Android APK
        id: build_step
        env:
          INPUT_BUILD_MODE: ${{ github.event.inputs.build_mode }}
          INPUT_SPLIT_ABI: ${{ github.event.inputs.split_per_abi }}
        run: |
          set -o pipefail
          MODE="$INPUT_BUILD_MODE"
          if [ -z "$MODE" ]; then MODE="$DEFAULT_BUILD_MODE"; fi
          SPLIT="$INPUT_SPLIT_ABI"
          if [ -z "$SPLIT" ]; then SPLIT="$DEFAULT_SPLIT_ABI"; fi
          echo "Building APK with MODE=$MODE, SPLIT=$SPLIT"
          if [ "$MODE" = "debug" ]; then
            flutter build apk --debug --no-tree-shake-icons 2>&1 | tee build_apk.log
          else
            flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_apk.log
            if [ "$SPLIT" = "true" ]; then
              flutter build apk --release --split-per-abi --no-tree-shake-icons 2>&1 | tee -a build_apk.log
            fi
          fi

      - name: Publish APK Build Report Check Run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let raw = fs.existsSync('build_apk.log') ? fs.readFileSync('build_apk.log', 'utf8') : '(build_apk.log not generated — earlier step failed)';
            const lines = raw.split('\n');
            const errLines = lines.filter(l => /FAILURE:|What went wrong:|Error:|Exception:|Could not|Execution failed|e: /i.test(l)).slice(-80);
            const tailLines = lines.slice(-120);
            let report = '=== KEY DIAGNOSTICS ===\n' + (errLines.length ? errLines.join('\n') : '(No error lines matched)') + '\n\n=== LOG TAIL (Last 120 Lines) ===\n' + tailLines.join('\n');
            if (report.length > 60000) report = report.slice(-60000);
            const ok = '${{ steps.build_step.outcome }}' === 'success';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'apk-build-report',
              head_sha: context.sha,
              status: 'completed',
              conclusion: ok ? 'success' : 'failure',
              output: {
                title: ok ? 'APK Build Succeeded' : 'APK Build Failed — See Error Log',
                summary: `Build step outcome: ${{ steps.build_step.outcome }}`,
                text: '```\n' + report + '\n```',
              },
            });

      - name: Prepare APK output folder
        run: |
          mkdir -p dist_apk
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk dist_apk/sanhour-online-release.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            cp build/app/outputs/flutter-apk/app-debug.apk dist_apk/sanhour-online-debug.apk
          fi
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            if [ -f "$f" ]; then
              cp "$f" dist_apk/
            fi
          done
          ls -lh dist_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanhour-online-apk
          path: dist_apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with direct APK download
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: "Sanhour Online — APK Build #${{ github.run_number }} (${{ github.ref_name }})"
          body: |
            ### 📱 نسخة أندرويد الجاهزة للتثبيت (Release APK)
            - **الفرع (Branch):** `${{ github.ref_name }}`
            - **الالتزام (Commit):** `${{ github.sha }}`
            - **الملف المباشر:** `sanhour-online-release.apk`
          files: dist_apk/*.apk
          prerelease: false
