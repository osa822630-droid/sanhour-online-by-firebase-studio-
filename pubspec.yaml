name: sanhour_online
description: "A comprehensive local guide application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- 1. Localization ---
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  google_fonts: ^8.0.2

  # --- 2. Firebase (Backend) ---
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: any
  firebase_messaging: ^16.1.1
  firebase_analytics: ^12.1.2

  # --- 3. State Management & Storage ---
  provider: ^6.1.2
  shared_preferences: any
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # --- 4. UI/UX ---
  cupertino_icons: ^1.0.6
  carousel_slider: ^5.0.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  font_awesome_flutter: ^10.7.0

  # --- 5. Utilities ---
  image_picker: ^1.1.2
  file_picker: ^10.3.10
  excel: ^4.0.0
  url_launcher: ^6.3.0
  logger: ^2.4.0
  uuid: ^4.0.0
  share_plus: ^12.0.1

  # --- 6. Features ---
  speech_to_text: ^7.3.0
  permission_handler: ^12.0.1
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  crypto: ^3.0.7
  package_info_plus: ^9.0.0
  faker: ^2.2.0
  image_cropper: ^12.2.0
  http: ^1.6.0
  firebase_app_check: ^0.4.3
  firebase_crashlytics: ^5.2.0
  app_links: ^6.4.1
  cloud_functions: ^6.2.0
  flutter_secure_storage: ^10.0.0
  video_player: ^2.10.1
  google_generative_ai: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1
  mockito: ^5.6.3
  build_runner: ^2.11.1

flutter_native_splash:
  color: "#0D0614"
  image: assets/images/splash_background.png
  android_12:
    image: assets/images/splash_background.png
    color: "#0D0614"

flutter_icons:
  android: "launcher_icon"
  ios: true
  # image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
